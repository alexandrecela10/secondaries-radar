[project]
name = "firstcall"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "confluent-kafka>=2.16.0",
    "duckdb>=2.0.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langfuse==5.0.4",
    "pydantic>=2",
    "pytest>=9.1.1",
    "python-dotenv==1.2.4",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
firstcall = "fc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fc", "fc.classify", "fc.sources", "fc.stream"]
