[project]
name = "quicklook"
version = "0.1.0"
description = "Quick Look: screen secondaries sale offers from email, with sourced numbers"
readme = "README.md"
authors = [
    { name = "Alexandre Cela", email = "alexandrecelap@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosmtpd>=1.4.6",
    "anthropic>=2.3.0",
    "duckdb>=2.0.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
radar = "quicklook.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
